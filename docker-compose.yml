version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: gridwatch_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Naresh@574
      POSTGRES_DB: GridwatchDB
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Backend/src/db/Gridwatch_Schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./Backend/src/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./Backend
    container_name: gridwatch_backend
    ports:
      - "3000:3000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: GridwatchDB
      DB_USER: postgres
      DB_PASSWORD: Naresh@574
      PORT: 3000
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./Frontend
    container_name: gridwatch_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
